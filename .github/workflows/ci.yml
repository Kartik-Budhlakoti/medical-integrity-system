name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10 
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-dev.txt 
      - run: ruff check .         
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: karma
          POSTGRES_PASSWORD: "1234567890"
          POSTGRES_DB: migration_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U karma -d migration_check"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://karma:1234567890@localhost:5432/medical_integrity_test
      SECRET_KEY: 2926a35a368310abdb4ceb201300864d
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      STORAGE_BACKEND: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: requirements-installation
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: actual-tests
        run: pytest -v
      - name: migration_check
        env:
          DATABASE_URL: postgresql://karma:1234567890@localhost:5432/migration_check
        run: |
          alembic upgrade head
          alembic check
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: docker-integration
        run: docker build -t medical-integrity-api:ci .