version: 2
updates:
  # Python libraries from requirements.txt
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7        # wait a week after a release before proposing it
    groups:
      python-minor-patch:    # one PR for all small updates; majors stay separate
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # boto3: no version-update PRs until pinned and retested against Backblaze
      - dependency-name: "boto3"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      # redis: stay below the next major on purpose (see decisions log)
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]
      # SQLAlchemy 2.1 makes psycopg 3 the default for postgresql:// URLs; we use psycopg2.
      # Stay on 2.0.x until migrated on purpose.
      - dependency-name: "SQLAlchemy"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
            # websockets: REST-only API, no benefit from a new major.
      - dependency-name: "websockets"
        update-types:
          - "version-update:semver-major"
      # botocore and s3transfer move together with boto3. CI cannot test Backblaze,
      # so all three are bumped by hand after a smoke test.
      - dependency-name: "botocore"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "s3transfer"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    commit-message:
      prefix: "chore"

# workflow actions (keeps the SHA pins current)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore"

# base image in the Dockerfile
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"